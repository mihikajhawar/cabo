# Render Blueprint: two web services (game server + website).
# Deploy order: 1) server  2) copy its public URL into the web service's NEXT_PUBLIC_SERVER_URL  3) copy the web URL into the server's CORS_ORIGIN.
services:
  - type: web
    name: cabo-server
    runtime: node
    buildCommand: npm install
    startCommand: npm run start -w @cabo/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: cabo-db, property: connectionString }
      - key: CORS_ORIGIN
        sync: false   # e.g. https://cabo-web.onrender.com
  - type: web
    name: cabo-web
    runtime: node
    buildCommand: npm install && npm run build -w @cabo/web
    startCommand: npm run start -w @cabo/web
    envVars:
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false   # e.g. https://cabo-server.onrender.com  (needed at BUILD time; redeploy after changing)

databases:
  - name: cabo-db   # PostgreSQL; the server creates its tables on first start
