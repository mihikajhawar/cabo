# Render Blueprint: game server + website (+ optional database).
# One click: Render > New > Blueprint > pick this repo > Apply.
# The two services have fixed names, so their addresses are known in advance:
#   server  https://mihika-cabo-server.onrender.com
#   website https://mihika-cabo-web.onrender.com   <- share this one with friends
# (If Render says a name is taken it adds letters; then set the two values below to the real addresses and redeploy.)
services:
  - type: web
    name: mihika-cabo-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start -w @cabo/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mihika-cabo-db, property: connectionString }
      - key: CORS_ORIGIN
        value: https://mihika-cabo-web.onrender.com
  - type: web
    name: mihika-cabo-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @cabo/web
    startCommand: npm run start -w @cabo/web
    envVars:
      - key: NEXT_PUBLIC_SERVER_URL   # baked in at BUILD time; redeploy the website after changing it
        value: https://mihika-cabo-server.onrender.com

databases:
  - name: mihika-cabo-db   # PostgreSQL, free plan (Render deletes free databases after 30 days; the game keeps working without it)
    plan: free
